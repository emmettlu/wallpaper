[package]
name = "wallpaper"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
ntex = { version = "2.17", features = ["compio", "rustls"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
futures = "0.3"
windows = { version = "0.62", features = ["Win32_System_WinRT", "Win32_UI_WindowsAndMessaging", "System_UserProfile", "Storage_Streams", "Foundation"] }

[profile.dev]
# debug = false

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = 's'
panic = "abort"
strip = true
