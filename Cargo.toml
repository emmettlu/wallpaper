[package]
name = "wallpaper"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
reqwest = { version = "0.12", features = ["blocking"] }
serde_json = "1.0"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.dev]
debug = false

[profile.release]
codegen-units = 1
debug = false
lto = true
panic = "abort"
strip = true
