[package]
name = "wallpaper"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
ntex = { version = "2.18", default-features = false, features = ["compio", "openssl"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
futures = "0.3"
windows = { version = "0.62", features = [
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
    "System_UserProfile",
    "Storage_Streams",
    "Foundation",
] }

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = 's'
strip = true

[target.'cfg(unix)']
panic = "abort"
