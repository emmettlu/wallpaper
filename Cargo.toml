[package]
name = "wallpaper"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
reqwest = { version = "0.12", features = ["blocking"] }
serde_json = "1"
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.dev]
debug = 0

[profile.release]
debug = 0
strip = true
lto = true
