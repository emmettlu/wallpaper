[package]
name = "wallpaper"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["blocking"] }
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
serde_json = "1"

[profile.dev]
debug = 0

[profile.release]
debug = 0
strip = true
lto = true
