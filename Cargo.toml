[package]
name = "wallpaper"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ntex = { version = "3", default-features = false, features = ["neon-uring", "openssl"] }

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { git = "https://github.com/emmettlu/cidre.git", branch = "feat/ns-workspace-desktop-images", default-features = false, features = ["app", "blocks", "ca", "macos_27_0"] }
ntex = { version = "3", default-features = false, features = ["neon-polling", "openssl"] }

[target."cfg(windows)".dependencies]
futures = "0"
ntex = { version = "3", default-features = false, features = ["compio", "openssl"] }
windows = {
  version = "0",
  features = [
    "Foundation",
    "Storage_Streams",
    "System_UserProfile",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
  ]
}
